plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.main
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArguments.addAll '--width', '1920', '--height', '1080'
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArguments.addAll '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.main
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            sourceSet = sourceSets.main
            gameDirectory = project.file('run-data')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').toString(),
                    '--existing', file('src/main/resources/').toString()
        }
        configureEach {
            gameDirectory = project.file('run')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // copied over from Shots Fired - mc7
    maven { url "https://cursemaven.com" }
    maven {
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Maven Central"
        url = "https://mvnrepository.com/artifact/"
    }
}

dependencies {
    modImplementation "curse.maven:immersive-engineering-231951:6206989"

    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    modRuntimeOnly "curse.maven:engineered-schematics-1207780:6560826"

    // Added because I'm sick of dealing with mixin nonsense
    // https://mvnrepository.com/artifact/io.github.llamalad7/mixinextras-forge
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    jarJar(implementation("io.github.llamalad7:mixinextras-forge:0.5.0")) {
        version {
            strictly '[0.5.0,)'
            prefer '0.5.0'
        }
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

tasks.register('devJar', Jar) {
    dependsOn classes
    archiveClassifier.set('dev')
    from sourceSets.main.output
    manifest { attributes 'MixinConfigs': "${mod_id}.mixins.json" }
}

build.dependsOn devJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // MDG's mixin extension has no disableTargetValidator (mixingradle did);
    // it is a Mixin AP flag, so set it directly to keep the previous behaviour.
    options.compilerArgs << '-AdisableTargetValidator=true'
}